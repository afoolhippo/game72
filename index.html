<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フライングヒッポ</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet"></head>
<body><main id="app"><section id="title" class="screen"><img class="title-image" src="title.png" alt="フライングヒッポ"><p>タップで羽ばたけ！<br>木のすきまを抜けて、どこまで飛べる？<br>３回ぶつかるとゲームオーバー</p><button id="start">ゲームスタート</button></section><section id="play" class="screen" hidden><div class="hud"><strong id="distance">0 m</strong><span id="lives" aria-label="残りライフ3">♥♥♥</span><button id="back-title" aria-label="タイトルに戻る">タイトルへ</button></div><canvas id="canvas" width="360" height="576" aria-label="タップで上昇するゲーム"></canvas><div id="hint">タップして飛び立とう！</div></section><section id="result" class="screen" hidden><img class="result-image" src="result.png" alt="草原で休むカバ"><p class="brand">今回の飛行距離</p><strong id="final-distance">0 m</strong><div id="rank-stars" aria-label="ランク1 / 3">★☆☆</div><strong id="rank-title">ひよっこヒッポ</strong><p id="comment"></p><div id="resultButtons" class="resultButtons hidden" aria-hidden="true" inert><button id="shareButton" class="resultButton">Xでシェア</button><button id="registerButton" class="resultButton">記録を登録</button><button id="retry" class="resultButton">もう1回遊ぶ</button><button id="arcadeButton" class="resultButton">カバゲーセンへ</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="game.js?v=20261005-2"></script></body></html>
